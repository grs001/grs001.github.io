<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: #111; }

  .footer {
    position: relative;
    color: #e6e1d8;
    padding: 56px 20px 80px;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.15) 0%, rgba(0,0,0,.95) 100%),
      url("newfon1/susha2.jpg") center / cover no-repeat;
  }
  .footer-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
  }
  .footer h3 {
    font-size: 21px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 18px;
  }
  .footer ul { list-style: none; }
  .footer li { margin-bottom: 10px; font-size: 15px; }

  /* Bölmələr: hələlik aktiv deyil */
  .footer .links a {
    color: #d6d1c8;
    text-decoration: none;
    cursor: default;
  }
  /* Aktiv edəndə .links a-ya .active əlavə olunur */
  .footer .links a.active { cursor: pointer; }
  .footer .links a.active:hover { color: #fff; text-decoration: underline; }

  .store a {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #e6e1d8;
    text-decoration: none;
    margin-bottom: 20px;
    font-size: 15px;
  }
  .store i { font-size: 26px; width: 30px; text-align: center; }
  .store .fa-google-play { color: #4db6ac; }

  .contact li { display: flex; align-items: center; gap: 12px; }
  .contact i { width: 18px; text-align: center; color: #d6d1c8; }
  .contact a { color: inherit; text-decoration: none; }
  .contact a:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .footer-inner { grid-template-columns: 1fr; gap: 32px; }
  }
</style>
</head>
<body>

<footer class="footer">
  <div class="footer-inner">

    <div>
      <h3>Bölmələr</h3>
      <ul class="links">
        <!-- href yoxdur, ona görə hələ aktiv deyil -->
        <li><a>Vətən müharibəsi şəhidləri</a></li>
        <li><a>Xronologiya</a></li>
        <li><a>Xəritə</a></li>
        <li><a>Xarı bülbül</a></li>
        <li><a>44 gün 44 addım 44 hekayə</a></li>
        <li><a>Əlaqə</a></li>
        <li><a>Haqqımızda</a></li>
      </ul>
    </div>

    <div class="store">
      <h3>Mobil cihazda</h3>
      <a><i class="fa-brands fa-google-play"></i> Google Play</a>
      <a><i class="fa-brands fa-apple"></i> Apple Store</a>
    </div>

    <div>
      <h3>Bizimlə əlaqə</h3>
      <ul class="contact">
        <li><i class="fa-solid fa-location-dot"></i> Mingəçevir şəhəri</li>
        <li><i class="fa-solid fa-envelope"></i>
          <a href="mailto:ramalrustemov003@gmail.com">ramalrustemov003@gmail.com</a></li>
      </ul>
    </div>

  </div>
</footer>

</body>
</html>
